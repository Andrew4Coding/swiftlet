name: Swiftlet

options:
  bundleIdPrefix: com.andrew4coding.swiftlet
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.5"

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: "92QV2QPDKA"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

schemes:
  Swiftlet:
    build:
      targets:
        "Swiftlet": all
        SwiftletShareExtension: all
        SwiftletWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Swiftlet Share Extension:
    build:
      targets:
        SwiftletShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  "Swiftlet":
    type: application
    platform: iOS
    sources:
      - path: "Swiftlet"
    info:
      path: "Swiftlet/Info.plist"
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: com.andrew4coding.swiftlet.Swiftlet
            CFBundleURLSchemes:
              - swiftlet
        UIBackgroundModes:
          - fetch
          - remote-notification
    entitlements:
      path: "Swiftlet/Swiftlet.entitlements"
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.andrew4coding.swiftlet.Swiftlet
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.andrew4coding.swiftlet.sharedData
    dependencies:
      - target: SwiftletShareExtension
        embed: true
      - target: SwiftletWidgets
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "iPhone Developer"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 4
        DEVELOPMENT_TEAM: "92QV2QPDKA"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Swiftlet"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a bill to attach it to a transaction."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach a photo of a bill from your library to a transaction."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.swiftlet.Swiftlet
        PRODUCT_NAME: "$(TARGET_NAME)"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1"

  SwiftletShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: "SwiftletShareExtension"
    entitlements:
      path: "SwiftletShareExtension/SwiftletShareExtension.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.andrew4coding.swiftlet.sharedData
    info:
      path: "SwiftletShareExtension/Info.plist"
      properties:
        CFBundleDisplayName: Swiftlet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 4
        DEVELOPMENT_TEAM: "92QV2QPDKA"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.swiftlet.Swiftlet.SwiftletShareExtension
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"

  SwiftletWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: "SwiftletWidgets"
      - path: "Swiftlet/Shared/TodaySpendingSnapshot.swift"
      - path: "Swiftlet/Services/CurrencyFormatter.swift"
    entitlements:
      path: "SwiftletWidgets/SwiftletWidgets.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.andrew4coding.swiftlet.sharedData
    info:
      path: "SwiftletWidgets/Info.plist"
      properties:
        CFBundleDisplayName: Swiftlet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 4
        DEVELOPMENT_TEAM: "92QV2QPDKA"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.swiftlet.Swiftlet.SwiftletWidgets
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
